version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: coursera-postgres
    ports:
      - "5433:5432" # Changed from 5432:5432 to use port 5433 on the host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coursera20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coursera-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: coursera-pgadmin
    ports:
      - "5051:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - coursera-network
    depends_on:
      - postgres

networks:
  coursera-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
